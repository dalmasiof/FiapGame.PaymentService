apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-api-config
  labels:
    app: payment-api
data:
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8082
  Jwt__Issuer: FiapGamesApi
  Jwt__Audience: FiapGamesClients
  Jwt__Authority: http://auth-api:8081
  RabbitMq__HostName: rabbitmq
  RabbitMq__Port: "5672"

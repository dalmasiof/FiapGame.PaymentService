version: '3.9'

services:
  payment-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiapgames-payment-api
    ports:
      - "8083:8082"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "Server=sqlserver-payment,1433;Database=fiapgames_payment;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;ConnectRetryCount=20;ConnectRetryInterval=5"
      Jwt__Authority: "${JWT_AUTHORITY:?Set JWT_AUTHORITY}"
    depends_on:
      sqlserver-payment:
        condition: service_healthy
    networks:
      - fiapgames-network

  sqlserver-payment:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiapgames-payment-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}"
    ports:
      - "1436:1433"
    volumes:
      - sqlserver-payment-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiapgames-network

volumes:
  sqlserver-payment-data:

networks:
  fiapgames-network:
